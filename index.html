.tag2{top:3.4rem;background:var(--hot);color:#000;font-size:1.05rem;max-width:92%;line-height:1.25}
.play{position:absolute;right:1rem;bottom:1rem;width:4.2rem;height:4.2rem;background:#ffe600;border:4px solid #000;display:grid;place-items:center}
.play::after{content:"";border-left:1.5rem solid #000;border-block:.95rem solid transparent;margin-left:.4rem}
.beat.on .play::after{border:0;width:1.3rem;height:1.5rem;margin:0;background:linear-gradient(90deg,#000 35%,transparent 35% 65%,#000 65%)}
.meta{padding:1rem 1.1rem 1.2rem}.num{font-weight:700;font-size:.85rem}

.credit{font-weight:700;margin-bottom:1rem}
.inq{display:block;text-align:center;background:#000;color:#ffe600;text-decoration:none;font-weight:700;padding:.9rem;border:4px solid #000}
.beat.on .inq{border-color:#000}
footer{padding:2rem clamp(1rem,3vw,2.5rem);font-weight:700}
.player{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;align-items:center;gap:.6rem;background:#000;color:#ffe600;padding:.8rem clamp(.8rem,3vw,2rem);padding-bottom:calc(.8rem + env(safe-area-inset-bottom,0px));border-top:4px solid #ffe600}
.player[hidden]{display:none}

.player button:focus-visible{outline:3px solid var(--hot)}
.now{font:400 1.3rem var(--d);flex:0 1 14rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seek{flex:1;min-width:60px;accent-color:var(--hot)}
.toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,20px);background:var(--hot);color:#000;border:4px solid #000;padding:.7rem 1rem;font-weight:700;opacity:0;pointer-events:none;transition:.2s;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.now{display:none}.top span:last-child{display:none}}
@media(prefers-reduced-motion:reduce){.belt div{animation:none}}
