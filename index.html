<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEATS OCTUBRE — shelovesttute©</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe600;--ink:#000;--card:#fffbe0;--hot:#ff4fa3;--on:#ffe600;--sh:#000;--line:4px solid var(--ink);
--d:"Anton",Impact,"Arial Narrow Bold",sans-serif;--b:"Space Grotesk",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--ink:#ffe600;--card:#141414;--on:#000;--sh:#ffe600}}
:root[data-theme="dark"]{--bg:#0a0a0a;--ink:#ffe600;--card:#141414;--on:#000;--sh:#ffe600}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:500 1rem var(--b);padding-bottom:110px;-webkit-font-smoothing:antialiased}
.top{display:flex;justify-content:space-between;gap:1rem;padding:.9rem clamp(1rem,3vw,2.5rem);border-bottom:var(--line);font-weight:700;font-size:.9rem}
.hero{padding:clamp(1.5rem,4vw,3rem) clamp(1rem,3vw,2.5rem) 1.5rem}
h1{font:400 clamp(4.2rem,22vw,20rem)/.82 var(--d)}
.hero p{margin:1.4rem 0 1rem;max-width:34ch;font-size:1.2rem;font-weight:700}
.belt{border-block:var(--line);background:var(--ink);color:var(--on);overflow:hidden;white-space:nowrap;font:400 1.5rem var(--d);padding:.5rem 0}
.belt div{display:inline-block;animation:m 30s linear infinite}.belt span{margin-right:2rem}
@keyframes m{to{transform:translateX(-50%)}}
.vault{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:2rem;padding:clamp(1rem,3vw,2.5rem)}
.beat{background:var(--card);border:var(--line);box-shadow:10px 10px 0 var(--sh)}
.beat.on{background:var(--hot);color:#000}
.cover{all:unset;display:block;position:relative;width:100%;aspect-ratio:1;cursor:pointer;border-bottom:var(--line);overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:0;top:1rem;background:#000;color:#ffe600;font:400 1.5rem var(--d);padding:.2rem .8rem .2rem 1rem}
.play{position:absolute;right:1rem;bottom:1rem;width:4.2rem;height:4.2rem;background:#ffe600;border:4px solid #000;display:grid;place-items:center}
.play::after{content:"";border-left:1.5rem solid #000;border-block:.95rem solid transparent;margin-left:.4rem}
.beat.on .play::after{border:0;width:1.3rem;height:1.5rem;margin:0;background:linear-gradient(90deg,#000 35%,transparent 35% 65%,#000 65%)}
.meta{padding:1rem 1.1rem 1.2rem}.num{font-weight:700;font-size:.85rem}
h2{font:400 clamp(1.8rem,4vw,2.5rem)/.95 var(--d);margin:.3rem 0 .5rem;overflow-wrap:anywhere}
.credit{font-weight:700;margin-bottom:1rem}
.inq{display:block;text-align:center;background:#000;color:#ffe600;text-decoration:none;font-weight:700;padding:.9rem;border:4px solid #000}
.beat.on .inq{border-color:#000}
footer{padding:2rem clamp(1rem,3vw,2.5rem);font-weight:700}
.player{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;align-items:center;gap:.6rem;background:#000;color:#ffe600;padding:.8rem clamp(.8rem,3vw,2rem);padding-bottom:calc(.8rem + env(safe-area-inset-bottom,0px));border-top:4px solid #ffe600}
.player[hidden]{display:none}
.player button{all:unset;cursor:pointer;width:2.7rem;height:2.7rem;display:grid;place-items:center;border:3px solid #ffe600}
.player button:focus-visible{outline:3px solid var(--hot)}
.now{font:400 1.3rem var(--d);flex:0 1 14rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seek{flex:1;min-width:60px;accent-color:var(--hot)}
.toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,20px);background:var(--hot);color:#000;border:4px solid #000;padding:.7rem 1rem;font-weight:700;opacity:0;pointer-events:none;transition:.2s;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.now{display:none}.top span:last-child{display:none}}
</style></head><body>
<header class="top"><span>shelovesttute©</span><span>PRIVATE VAULT / INQUIRY ONLY</span></header>
<section class="hero"><h1>BEATS<br>OCTUBRE</h1>
<p>Nada se vende acá. Elegí un beat, escuchalo y escribime por Instagram.</p></section>
<div class="belt" aria-hidden="true"><div id="belt"></div></div>
<main class="vault" id="vault"></main>
<footer>shelovesttute© — @shelovesttute</footer>
<div class="player" id="player" hidden>
<button id="prev" aria-label="Anterior">&#9198;</button><button id="tg" aria-label="Play o pausa">&#9654;</button><button id="next" aria-label="Siguiente">&#9197;</button>
<div class="now" id="now">—</div><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posición"><time id="time">0:00</time></div>
<audio id="a" preload="auto"></audio><div class="toast" id="toast" role="status"></div>
<script>
const OWN="@shelovesttute";
const $=s=>document.querySelector(s),a=$("#a");
$("#belt").innerHTML=Array(8).fill("<span>NO DOWNLOADS ✦ NO LEAKS ✦ INQUIRE ONLY ✦</span>").join("");

const beats = [
  {
    "title": "BEAT 1",
    "src": "./assets/audio/beat_1.mp3",
    "img": "cover.jpg"
  },
  {
    "title": "BEAT 10",
    "src": "./assets/audio/beat_10.mp3",
    "img": "cover.jpg"
  },
  {
    "title": "BEAT 11",
    "src": "./assets/audio/beat_11.mp3",
    "img": "cover.jpg"
  },
  {
    "title": "BEAT 12",
    "src": "./assets/audio/beat_12.mp3",
    "img": "cover.jpg"
  },
  {
    "title": "BEAT 2",
    "src": "./assets/audio/beat_2.wav",
    "img": "cover.jpg"
  },
  {
    "title": "BEAT 3",
    "src": "./assets/audio/beat_3.mp3",
    "img": "cover.jpg"
  },
  {
    "title": "BEAT 4",
    "src": "./assets/audio/beat_4.mp3",
    "img": "cover.jpg"
  },
  {
    "title": "BEAT 5",
    "src": "./assets/audio/beat_5.mp3",
    "img": "cover.jpg"
  },
  {
    "title": "BEAT 6",
    "src": "./assets/audio/beat_6.mp3",
    "img": "cover.jpg"
  },
  {
    "title": "BEAT 7",
    "src": "./assets/audio/beat_7.mp3",
    "img": "cover.jpg"
  },
  {
    "title": "BEAT 8",
    "src": "./assets/audio/beat_8.mp3",
    "img": "cover.jpg"
  },
  {
    "title": "BEAT 9",
    "src": "./assets/audio/beat_9.mp3",
    "img": "cover.jpg"
  }
] ;

let cur=-1;

function render(){
    $("#vault").innerHTML=beats.map((b,i)=>{
        const t=b.title;
        return `<article class="beat" data-i="${i}"><button class="cover"><img src="${b.img}" alt="${t}"><span class="tag">${OWN}</span><span class="play"></span></button>
        <div class="meta"><span class="num">${String(i+1).padStart(2,"0")} / shelovesttute©</span><h2>${t}</h2>
        <p class="credit">PROD. ${OWN}</p>
        <a class="inq" href="https://ig.me/m/shelovesttute" target="_blank" rel="noopener" data-m="Hola, consulta por el beat ${t}">Consultar por Instagram</a></div></article>`
    }).join("");
    document.querySelectorAll(".cover").forEach((c,i)=>c.onclick=()=>play(i));
    document.querySelectorAll(".inq").forEach(l=>l.onclick=async()=>{try{await navigator.clipboard.writeText(l.dataset.m)}catch{}toast("Mensaje copiado. Pegalo en el DM.")})
}

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2800)}

function sync(){
    document.querySelectorAll(".beat").forEach((e,i)=>e.classList.toggle("on",i===cur&&!a.paused));
    $("#tg").innerHTML=a.paused?"&#9654;":"&#10074;&#10074;";
}

async function play(i){
    const b=beats[i];
    if(!b) return;
    if(i===cur){
        if(a.paused){
            try{ await a.play(); }catch(e){ console.error(e); }
        }else{
            a.pause();
        }
        sync();
        return;
    }
    cur=i;
    a.src=b.src;
    $("#now").textContent=b.title;
    $("#player").hidden=false;
    a.load();
    try{
        await a.play();
    }catch(e){
        console.error("Play error:", e);
    }
    sync();
}

const step=d=>{const n=beats.length;if(n) play((cur+d+n)%n)};
$("#tg").onclick=()=>a.paused?a.play().catch(e=>console.error(e)):a.pause();
$("#next").onclick=()=>step(1);
$("#prev").onclick=()=>step(-1);
a.onplay=a.onpause=sync;
a.onended=()=>step(1);
a.ontimeupdate=()=>{
    if(a.duration){ $("#seek").value=(a.currentTime/a.duration)*1000; }
    const t=a.currentTime||0;
    const m=Math.floor(t/60);
    const s=String(Math.floor(t%60)).padStart(2,"0");
    $("#time").textContent=m+":"+s;
};
$("#seek").oninput=e=>{ if(a.duration) a.currentTime=(e.target.value/1000)*a.duration; };

render();
</script></body></html>
